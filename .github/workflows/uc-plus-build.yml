name: UC Plus build and release

# Upload UC-Plus-source.zip to the repository root. The workflow then:
#  1. unpacks it over the repository (replacing the files) and commits the result,
#  2. restores the release signing key from the KEYSTORE_BASE64 secret (or creates it once),
#  3. builds the native engines and the signed APKs,
#  4. publishes one release per build, marked as the latest, with an APK for every ABI.
# Tor bridges are collected by the separate "UC Plus Tor bridges" workflow.

on:
  push:
    # Branch pushes only. Tag pushes ignore "paths", so without this the release tags
    # created by this workflow would start it again.
    branches:
      - "**"
    paths:
      - "UC-Plus-source.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uc-plus-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # WORKFLOW_TOKEN (fine-grained PAT) is needed to store the signing key and to push the
      # unpacked files; the default token is only a fallback for the release step.
      GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || github.token }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}
          fetch-depth: 1

      - name: Unpack UC-Plus-source.zip over the repository
        run: |
          set -euo pipefail
          if [ ! -f UC-Plus-source.zip ]; then
            echo "UC-Plus-source.zip is missing; nothing to unpack."
            exit 1
          fi
          rm -rf .unpack && mkdir .unpack
          unzip -q UC-Plus-source.zip -d .unpack
          cp -a .unpack/. .
          rm -rf .unpack UC-Plus-source.zip
          # The previous workflow is replaced by this one.
          rm -f .github/workflows/build-android.yml

      - name: Commit the unpacked source
        run: |
          set -euo pipefail
          git config user.name "uc-plus-build"
          git config user.email "uc-plus-build@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The repository already matches the archive."
          else
            git commit -m "Apply UC Plus source archive [skip ci]"
            # Explicit branch ref: a run can start from a tag checkout, and a bare name would hit the tag.
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Psiphon core must be built with Go 1.22: its psiphon-tls fork checks the layout of
      # crypto/tls against that release and panics at start with any newer toolchain.
      - name: Set up Go 1.22 for the Psiphon core
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Remember the Go 1.22 path
        run: echo "PSIPHON_GO=$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"

      - name: Set up Go for the native engines
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Set up Android NDK r28
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: false

      - name: Prepare the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          KS=android/keystore/uc-plus-release.jks
          if [ -n "${KEYSTORE_BASE64}" ]; then
            if [ -z "${KEYSTORE_PASSWORD}" ]; then
              echo "KEYSTORE_BASE64 exists but KEYSTORE_PASSWORD is missing. Add it, or the key would be replaced."
              exit 1
            fi
            echo "${KEYSTORE_BASE64}" | base64 -d > "$KS"
            PASS="${KEYSTORE_PASSWORD}"
            echo "Using the release signing key from the repository secrets."
          else
            PASS=$(openssl rand -hex 24)
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -storepass "$PASS" -keypass "$PASS" -alias ucplus \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=UC Plus, O=UC Plus, C=IR"
            base64 -w0 "$KS" | gh secret set KEYSTORE_BASE64
            printf '%s' "$PASS" | gh secret set KEYSTORE_PASSWORD
            echo "Created a new release signing key and stored it in the repository secrets."
          fi
          echo "UC_PLUS_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Restore built native engines
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs/*/*.so
          key: native-go122-${{ hashFiles('android/tools/build_native_libs.sh', 'android/patches/**', 'android/app/singbox-core.json', 'android/native/**') }}

      - name: Build the native engines
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash android/tools/build_native_libs.sh

      - name: Build libopenconnect (OpenConnect engine)
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash android/native/build-openconnect.sh

      - name: Build signed release APKs
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Report only: lint findings never stop the release. NewApi is the check that matters for minSdk 26.
      - name: Lint report (report only)
        continue-on-error: true
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew lintRelease --continue --no-daemon || true
          mkdir -p lint-report
          # Each module writes a report with the same name, so the copy keeps the module path in the file name.
          find . -path "*/build/reports/lint-results-release*" -type f -exec sh -c 'cp "$1" "lint-report/$(echo "$1" | sed "s#^\./##; s#/#_#g")"' _ {} \; 2>/dev/null || true
          echo "### Lint: API levels newer than minSdk 26 (NewApi)" >> "$GITHUB_STEP_SUMMARY"
          grep -h "NewApi" lint-report/*.txt 2>/dev/null | head -200 >> "$GITHUB_STEP_SUMMARY" || echo "none found" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/lint-report/
          if-no-files-found: ignore

      - name: Publish the release as the latest
        run: |
          set -euo pipefail
          VERSION="1.5.2"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          APKS=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort)
          if [ -z "$APKS" ]; then
            echo "No APK was produced."
            exit 1
          fi
          gh release create "$TAG" $APKS \
            --target "$GITHUB_SHA" \
            --latest \
            --title "UC Plus ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from the uploaded UC-Plus-source.zip. Install the APK for your device's ABI (arm64-v8a for most phones)."
